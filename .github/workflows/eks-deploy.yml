name: EKS - Deploy

on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: "EKS 클러스터 이름"
        required: true
        default: "devtrouble-ai"
      region:
        description: "AWS 리전"
        required: true
        default: "ap-northeast-2"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 첫 배포면 저장소가 없어서 push가 실패하므로, 없을 때만 만든다.
      - name: Ensure ECR repositories exist
        run: |
          for repo in devtrouble-ai-backend devtrouble-ai-frontend; do
            aws ecr describe-repositories --repository-names "$repo" --region "${{ inputs.region }}" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "$repo" --region "${{ inputs.region }}"
          done

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -f ./devtrouble-ai-backend/docker/Dockerfile \
            -t "$REGISTRY/devtrouble-ai-backend:${{ github.sha }}" \
            -t "$REGISTRY/devtrouble-ai-backend:latest" \
            ./devtrouble-ai-backend
          docker push "$REGISTRY/devtrouble-ai-backend:${{ github.sha }}"
          docker push "$REGISTRY/devtrouble-ai-backend:latest"

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -f ./devtrouble-ai-frontend/docker/Dockerfile \
            -t "$REGISTRY/devtrouble-ai-frontend:${{ github.sha }}" \
            -t "$REGISTRY/devtrouble-ai-frontend:latest" \
            ./devtrouble-ai-frontend
          docker push "$REGISTRY/devtrouble-ai-frontend:${{ github.sha }}"
          docker push "$REGISTRY/devtrouble-ai-frontend:latest"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ inputs.cluster_name }}" --region "${{ inputs.region }}"

      # DB 비밀번호/JWT 키 등은 Helm chart의 templates/secret.yaml이 관리한다 (values의
      # secrets.* 아래로 들어감). kubectl로 별도 Secret을 먼저 만들지 않는다 — 그렇게 하면
      # helm이 "이미 있는데 내가 관리하는 게 아닌" 리소스를 만나 소유권 충돌 에러를 낸다.
      # 대신 GitHub Secrets를 임시 values 파일로 안전하게 변환해 helm에 -f로 넘긴다
      # (--set은 콤마/특수문자가 든 비밀번호에서 깨지기 쉬워 파일 방식이 더 안전하다).
      - name: Build secret values file from GitHub Secrets
        run: |
          python3 - <<'PYEOF'
          import yaml
          import os

          secrets = {
              "jwtSecretKey": os.environ["JWT_SECRET_KEY"],
              "databaseUrl": os.environ["DATABASE_URL"],
              "redisUrl": os.environ["REDIS_URL"],
              "celeryBrokerUrl": os.environ["CELERY_BROKER_URL"],
              "celeryResultBackendUrl": os.environ["CELERY_RESULT_BACKEND"],
              "openaiApiKey": os.environ.get("OPENAI_API_KEY", ""),
              "watsonxApiKey": os.environ.get("WATSONX_API_KEY", ""),
              "watsonxProjectId": os.environ.get("WATSONX_PROJECT_ID", ""),
              "cohereApiKey": os.environ.get("COHERE_API_KEY", ""),
              "langsmithApiKey": os.environ.get("LANGSMITH_API_KEY", ""),
          }
          with open("/tmp/secret-values.yaml", "w") as f:
              yaml.dump({"secrets": secrets}, f)
          PYEOF
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          CELERY_BROKER_URL: ${{ secrets.CELERY_BROKER_URL }}
          CELERY_RESULT_BACKEND: ${{ secrets.CELERY_RESULT_BACKEND }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WATSONX_API_KEY: ${{ secrets.WATSONX_API_KEY }}
          WATSONX_PROJECT_ID: ${{ secrets.WATSONX_PROJECT_ID }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}

      - name: Deploy with Helm
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          helm upgrade --install devtrouble-ai ./deploy/helm/devtrouble-ai \
            -f /tmp/secret-values.yaml \
            --set image.registry="$REGISTRY" \
            --set image.backend.tag="${{ github.sha }}" \
            --set image.frontend.tag="${{ github.sha }}" \
            --wait --timeout 10m

      - name: Clean up temp secret file
        if: always()
        run: rm -f /tmp/secret-values.yaml

      - name: Show status
        run: |
          kubectl get pods -l app.kubernetes.io/instance=devtrouble-ai
          echo "## 배포 완료" >> $GITHUB_STEP_SUMMARY
          echo "ALB 주소가 뜨는 데 몇 분 걸릴 수 있습니다. 아래 명령으로 확인하세요:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "kubectl get ingress devtrouble-ai" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
