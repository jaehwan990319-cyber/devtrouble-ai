name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "devtrouble-ai-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "devtrouble-ai-frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: devtrouble-ai-frontend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: devtrouble-ai-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npx oxlint

      - name: Build
        run: npm run build
