name: EKS - Install Sealed Secrets

# 클러스터 생성 후 딱 한 번 수동 실행. push 트리거 없음.
on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: "EKS 클러스터 이름"
        required: true
        default: "devtrouble-ai"
      region:
        description: "AWS 리전"
        required: true
        default: "ap-northeast-2"

jobs:
  install-sealed-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ inputs.cluster_name }}" --region "${{ inputs.region }}"

      # kube-system에 설치 — Sealed Secrets 공식 문서의 기본 네임스페이스 관례를 따른다.
      - name: Install Sealed Secrets controller (via Helm)
        run: |
          helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
          helm repo update
          helm upgrade --install sealed-secrets sealed-secrets/sealed-secrets \
            -n kube-system \
            --set fullnameOverride=sealed-secrets-controller \
            --wait --timeout 5m

      - name: Verify
        run: |
          kubectl get pods -n kube-system -l app.kubernetes.io/name=sealed-secrets

      - name: Summary
        run: |
          echo "## Sealed Secrets 컨트롤러 설치 완료" >> $GITHUB_STEP_SUMMARY
          echo "- 로컬에서 kubeseal로 Secret을 암호화할 때 이 컨트롤러가 필요합니다." >> $GITHUB_STEP_SUMMARY
          echo "- 컨트롤러 이름: sealed-secrets-controller (네임스페이스: kube-system)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "kubeseal --controller-name sealed-secrets-controller --controller-namespace kube-system --format yaml < secret.yaml > sealed-secret.yaml" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY