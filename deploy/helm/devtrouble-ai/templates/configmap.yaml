apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devtrouble-ai.fullname" . }}-config
  labels:
    {{- include "devtrouble-ai.componentLabels" (dict "root" . "component" "config") | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
