apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devtrouble-ai.fullname" . }}-celery-worker
  labels:
    {{- include "devtrouble-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-worker
spec:
  replicas: {{ .Values.celeryWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "devtrouble-ai.selectorLabels" (dict "component" "celery-worker" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devtrouble-ai.selectorLabels" (dict "component" "celery-worker" "Release" .Release) | nindent 8 }}
    spec:
      containers:
        - name: celery-worker
          image: "{{ .Values.image.registry }}/devtrouble-ai-backend:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: {{ include "devtrouble-ai.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secretName }}
          env:
            # API 파드가 이미 pre-upgrade Job에서 마이그레이션을 실행하므로,
            # celery-worker까지 중복으로 돌릴 필요가 없다 (docker-compose와 동일한 이유).
            - name: RUN_MIGRATIONS
              value: "false"
          resources:
            {{- toYaml .Values.celeryWorker.resources | nindent 12 }}
