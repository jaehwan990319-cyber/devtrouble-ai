apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "devtrouble-ai.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "devtrouble-ai.componentLabels" (dict "root" . "component" "migration") | nindent 4 }}
  annotations:
    # helm upgrade/install 시 API 파드를 새로 띄우기 전에 이 Job이 먼저 끝나야 한다.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "devtrouble-ai.image" (dict "root" . "repository" .Values.image.backend.repository "tag" .Values.image.backend.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          # ConfigMap은 참조하지 않는다 — alembic은 DATABASE_URL(Secret)만 있으면 되고,
          # ConfigMap의 나머지 값들은 pydantic Settings에 기본값이 있어 없어도 무방하다.
          # (Helm pre-upgrade hook은 일반 템플릿보다 먼저 실행되므로, 이 Job이 ConfigMap을
          # 참조하면 아직 존재하지 않는 리소스를 참조하다 실패할 수 있어 아예 의존하지 않는다.)
          envFrom:
            - secretRef:
                name: {{ include "devtrouble-ai.fullname" . }}-secrets
