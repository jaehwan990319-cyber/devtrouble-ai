{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "devtrouble-ai.fullname" . }}
  labels:
    {{- include "devtrouble-ai.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.host }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
  {{- else }}
  rules:
    - http:
        paths:
  {{- end }}
          # 프론트엔드(React)가 상대경로 /api/v1/...로 호출하므로(VITE_API_BASE_URL=/api/v1),
          # ALB가 /api는 백엔드로, 나머지는 전부 프론트엔드로 갈라준다.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "devtrouble-ai.fullname" . }}-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "devtrouble-ai.fullname" . }}-frontend
                port:
                  number: 80
{{- end }}
