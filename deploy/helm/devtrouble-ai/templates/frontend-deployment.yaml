apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devtrouble-ai.fullname" . }}-frontend
  labels:
    {{- include "devtrouble-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "devtrouble-ai.selectorLabels" (dict "component" "frontend" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devtrouble-ai.selectorLabels" (dict "component" "frontend" "Release" .Release) | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.registry }}/devtrouble-ai-frontend:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devtrouble-ai.fullname" . }}-frontend
  labels:
    {{- include "devtrouble-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "devtrouble-ai.selectorLabels" (dict "component" "frontend" "Release" .Release) | nindent 4 }}
  ports:
    - port: 80
      targetPort: {{ .Values.frontend.port }}
