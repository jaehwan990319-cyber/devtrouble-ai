{{- /*
  secrets.manageSecret: true(기본값)면 이 템플릿이 평문 값으로 Secret을 직접 만든다
  (GitHub Actions --set 방식과 궁합이 맞다).
  secrets.manageSecret: false면 이 템플릿은 아무것도 만들지 않는다 — 대신
  templates/sealed-secret.yaml (kubeseal로 암호화된 SealedSecret)이 같은 이름
  ({{ include "devtrouble-ai.fullname" . }}-secrets)의 Secret을 컨트롤러를 통해
  간접적으로 만들어준다. Argo CD(GitOps) 경로에서는 평문을 Git에 올릴 수 없으므로
  이 값을 false로 둔다.
*/ -}}
{{- if .Values.secrets.manageSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devtrouble-ai.fullname" . }}-secrets
  labels:
    {{- include "devtrouble-ai.componentLabels" (dict "root" . "component" "secrets") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-2"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ required "secrets.jwtSecretKey는 반드시 채워야 합니다 (기본값 그대로 배포 금지)" .Values.secrets.jwtSecretKey | quote }}
  DATABASE_URL: {{ required "secrets.databaseUrl이 필요합니다 (RDS 접속 문자열)" .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ required "secrets.redisUrl이 필요합니다 (ElastiCache 접속 문자열)" .Values.secrets.redisUrl | quote }}
  CELERY_BROKER_URL: {{ required "secrets.celeryBrokerUrl이 필요합니다" .Values.secrets.celeryBrokerUrl | quote }}
  CELERY_RESULT_BACKEND: {{ required "secrets.celeryResultBackendUrl이 필요합니다" .Values.secrets.celeryResultBackendUrl | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  WATSONX_API_KEY: {{ .Values.secrets.watsonxApiKey | quote }}
  WATSONX_PROJECT_ID: {{ .Values.secrets.watsonxProjectId | quote }}
  COHERE_API_KEY: {{ .Values.secrets.cohereApiKey | quote }}
  LANGSMITH_API_KEY: {{ .Values.secrets.langsmithApiKey | quote }}
{{- end }}