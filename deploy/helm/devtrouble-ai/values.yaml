# DevTrouble AI Helm chart 기본값.
#
# MySQL/Redis는 이 chart에 포함하지 않는다 — RDS/ElastiCache 같은 관리형 서비스를
# 클러스터 밖에서 쓰는 걸 전제로 한다 (deploy/README.md "왜 DB를 클러스터 밖에 두는가" 참고).
# 그래서 secrets.databaseUrl / secrets.redisUrl 등은 전부 필수값이다.

image:
  # ECR 등 사설 레지스트리 주소. 예: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com
  registry: ""
  pullPolicy: IfNotPresent
  backend:
    repository: devtrouble-ai-backend
    tag: latest
  frontend:
    repository: devtrouble-ai-frontend
    tag: latest

imagePullSecrets: []
# - name: ecr-registry-secret

replicaCount:
  api: 2
  celeryWorker: 1
  frontend: 2

resources:
  api:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  celeryWorker:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  frontend:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

autoscaling:
  api:
    enabled: false   # 우선 꺼둠 — 트래픽 패턴 보고 필요할 때 true로 켤 것 (metrics-server 필요)
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

healthCheck:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 15

serviceAccount:
  create: true
  name: ""
  # EKS에서 IRSA(IAM Role for Service Account)로 AWS 리소스 접근이 필요해지면 여기에
  # eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/... 를 추가할 것.
  annotations: {}

ingress:
  enabled: true
  className: alb
  host: ""   # 예: devtrouble.example.com (비워두면 ALB의 기본 DNS로만 접속)
  # 추가로 필요한 ALB 주석(ACM 인증서 등)은 여기에 자유롭게 추가한다.
  # 예: alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:...
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

# --- 애플리케이션 설정 (민감하지 않은 값 — ConfigMap으로 들어감) ---
# app/core/config.py의 Settings 필드와 1:1 대응한다. 여기 없는 필드는 pydantic
# Settings의 기본값을 그대로 쓴다.
config:
  ENV: "prod"
  DEBUG: "false"
  LOG_LEVEL: "INFO"

  AI_PROVIDER: "local"
  VECTOR_DB_PROVIDER: "faiss"
  RAG_TOP_K: "5"
  RAG_MAX_RETRIEVAL_ATTEMPTS: "1"
  RAG_RETRY_SCORE_THRESHOLD: "0.05"
  RAG_ENABLE_QUERY_CONDENSATION: "true"
  RAG_ENABLE_CLASSIFY: "true"
  RAG_ENABLE_RERANK: "true"
  RAG_ENABLE_VALIDATION: "true"
  RERANK_PROVIDER: "llm"
  CONTEXT_CACHE_ENABLED: "true"
  CONTEXT_CACHE_BACKEND: "memory"   # 여러 파드가 캐시를 공유하려면 "redis"로 바꿀 것
  LANGSMITH_TRACING: "false"

# --- 민감한 값 (Secret으로 들어감) ---
# 운영에서는 여기 평문으로 커밋하지 말 것. eks-deploy.yml 워크플로가 GitHub Secrets로부터
# 이 값들을 --set으로 주입한다 (자세한 내용은 deploy/README.md 참고).
secrets:
  # true(기본값): 이 chart가 평문 값으로 Secret을 직접 만든다 (기존 GitHub Actions
  #   --set/-f 방식, 지금까지 쓰던 방식 그대로).
  # false: 이 chart는 Secret을 만들지 않는다 — 대신 별도의 SealedSecret(암호화되어
  #   Git에 안전하게 커밋 가능)이 같은 이름의 Secret을 컨트롤러를 통해 만들어준다.
  #   Argo CD(GitOps) 경로에서 평문 비밀번호를 Git에 올리지 않으려면 false로 둔다.
  manageSecret: true
  jwtSecretKey: "change-me-in-production"
  databaseUrl: ""
  redisUrl: ""
  celeryBrokerUrl: ""
  celeryResultBackendUrl: ""
  openaiApiKey: ""
  watsonxApiKey: ""
  watsonxProjectId: ""
  cohereApiKey: ""
  langsmithApiKey: ""