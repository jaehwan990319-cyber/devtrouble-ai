# DevTrouble AI 기본 values.
#
# 이 파일 그대로 `helm install`하면 MySQL/Redis/Qdrant까지 전부 클러스터 안에 떠서
# (kind/minikube 등 테스트 클러스터에서) 바로 검증해볼 수 있다.
#
# 실제 EKS 운영 배포 시에는 values-production.yaml.dist를 참고해서 별도 파일로
# 오버라이드할 것 — 특히 mysql.enabled/redis.enabled를 false로 두고 RDS/ElastiCache를
# 쓰는 것을 강력히 권장한다 (README "왜 DB를 클러스터 밖에 두는가" 참고).

# --- 이미지 ---
image:
  # ECR 등 사설 레지스트리 주소. 비워두면 각 이미지의 repository 값을 그대로 사용한다.
  # 예: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com
  registry: ""
  pullPolicy: IfNotPresent
  backend:
    repository: devtrouble-ai-backend
    tag: latest
  frontend:
    repository: devtrouble-ai-frontend
    tag: latest

imagePullSecrets: []
# - name: ecr-registry-secret

replicaCount:
  api: 2
  celeryWorker: 2
  frontend: 2

resources:
  api:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  celeryWorker:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  frontend:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }

autoscaling:
  api:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# 파드가 순차적으로 재시작되도록(한꺼번에 다 죽지 않도록) 보장.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

healthCheck:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

serviceAccount:
  create: true
  name: ""
  # EKS에서 IRSA(IAM Role for Service Account)로 S3 등 AWS 리소스에 접근할 때 사용.
  # 예: eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/devtrouble-ai-backend
  annotations: {}

ingress:
  enabled: true
  # EKS + AWS Load Balancer Controller 기준. 일반 nginx-ingress를 쓴다면
  # className을 "nginx"로 바꾸고 alb.ingress.kubernetes.io/* 주석은 지울 것.
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
  host: devtrouble.example.com
  tls:
    enabled: false
    secretName: devtrouble-ai-tls

# --- 애플리케이션 설정 (민감하지 않은 값 — ConfigMap으로 들어감) ---
# app/core/config.py의 Settings 필드와 1:1 대응한다.
config:
  ENV: production
  DEBUG: "false"
  API_V1_PREFIX: /api/v1

  DATABASE_POOL_SIZE: "10"
  DATABASE_POOL_RECYCLE_SECONDS: "1800"

  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "14"

  AWS_REGION: ap-northeast-2
  S3_BUCKET_NAME: ""

  VECTOR_DB_PROVIDER: qdrant
  QDRANT_COLLECTION_NAME: trouble_documents
  CHROMA_PERSIST_DIR: ./chroma_data
  CHROMA_COLLECTION_NAME: trouble_documents

  AI_PROVIDER: local
  EMBEDDING_MODEL_NAME: text-embedding-3-small
  LLM_MODEL_NAME: gpt-4o-mini

  WATSONX_URL: https://us-south.ml.cloud.ibm.com
  WATSONX_EMBEDDING_MODEL_ID: ibm/granite-embedding-107m-multilingual
  WATSONX_EMBEDDING_DIMENSION: "384"
  WATSONX_LLM_MODEL_ID: meta-llama/llama-3-3-70b-instruct

  RAG_TOP_K: "5"
  RAG_MAX_RETRIEVAL_ATTEMPTS: "1"
  RAG_RETRY_SCORE_THRESHOLD: "0.05"
  RAG_KEYWORD_MATCH_SCORE: "0.5"
  RAG_ENABLE_QUERY_CONDENSATION: "true"
  RAG_ENABLE_CLASSIFY: "true"
  RAG_ENABLE_RERANK: "true"
  RAG_ENABLE_VALIDATION: "true"

  RERANK_PROVIDER: llm
  COHERE_RERANK_MODEL: rerank-v3.5

  LANGSMITH_TRACING: "false"
  LANGSMITH_PROJECT: devtrouble-ai
  LANGSMITH_ENDPOINT: https://api.smith.langchain.com

  CONTEXT_CACHE_ENABLED: "true"
  CONTEXT_CACHE_BACKEND: redis
  CONTEXT_CACHE_TTL_SECONDS: "3600"

  LOG_LEVEL: INFO

# --- 민감한 값 (Secret으로 들어감) ---
# 운영에서는 여기에 평문으로 커밋하지 말 것 — `helm install --set secrets.jwtSecretKey=...`나
# External Secrets Operator / Sealed Secrets 같은 도구로 주입하는 것을 권장한다.
# mysql.enabled/redis.enabled/qdrant.enabled가 true(클러스터 내부)면 아래 URL들은
# templates에서 자동으로 클러스터 내부 서비스 주소로 채워지므로 비워둬도 된다 —
# false(외부 관리형 서비스 사용)로 바꿀 때만 직접 채워야 한다.
secrets:
  jwtSecretKey: "change-me-in-production"
  databaseUrl: ""
  redisUrl: ""
  celeryBrokerUrl: ""
  celeryResultBackendUrl: ""
  qdrantUrl: ""
  openaiApiKey: ""
  watsonxApiKey: ""
  watsonxProjectId: ""
  cohereApiKey: ""
  langsmithApiKey: ""

# --- 클러스터 내부 인프라 (기본값: 전부 켜짐 — 로컬/테스트 클러스터에서 바로 검증 가능) ---
# 운영(EKS)에서는 mysql/redis를 false로 두고 RDS/ElastiCache를 쓰는 것을 강력히 권장한다.
# (StatefulSet 기반 자체 호스팅 DB는 백업/장애조치를 직접 챙겨야 해서 관리 부담이 크다.)

mysql:
  enabled: true
  image: "mysql:8.4"
  database: devtrouble
  user: devtrouble
  password: devtrouble
  rootPassword: root
  persistence:
    size: 10Gi
    storageClassName: ""
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

redis:
  enabled: true
  image: "redis:7-alpine"
  persistence:
    size: 2Gi
    storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }

qdrant:
  enabled: true
  image: "qdrant/qdrant:latest"
  persistence:
    size: 10Gi
    storageClassName: ""
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 500m, memory: 1Gi }
