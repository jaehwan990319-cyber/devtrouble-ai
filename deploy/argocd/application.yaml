# Argo CD에게 "이 저장소의 deploy/helm/devtrouble-ai를 계속 지켜보고,
# 클러스터 상태를 거기 맞춰라"고 알려주는 매니페스트.
#
# secrets.manageSecret: false — 이 Helm chart는 더 이상 평문 Secret을 직접 만들지
# 않는다. 대신 deploy/argocd/sealed-secret.yaml (kubeseal로 암호화되어 Git에
# 안전하게 커밋된 SealedSecret)이 sealed-secrets 컨트롤러를 통해 같은 이름
# (devtrouble-ai-secrets)의 실제 Secret을 만들어준다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devtrouble-ai
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/jaehwan990319-cyber/devtrouble-ai.git
    targetRevision: main
    path: deploy/helm/devtrouble-ai
    helm:
      values: |
        image:
          registry: "722867460129.dkr.ecr.ap-northeast-2.amazonaws.com"
          backend:
            tag: "latest"
          frontend:
            tag: "latest"
        secrets:
          manageSecret: false

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    # 자동 동기화는 아직 켜지 않는다 — 처음에는 수동으로 SYNC 버튼을 눌러서
    # 눈으로 확인하며 진행하는 게 안전하다. 익숙해지면 automated 블록을 추가하면 된다.
    syncOptions:
      - CreateNamespace=false