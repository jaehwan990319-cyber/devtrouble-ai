# Argo CD에게 "이 저장소의 deploy/helm/devtrouble-ai를 계속 지켜보고,
# 클러스터 상태를 거기 맞춰라"고 알려주는 매니페스트.
#
# ⚠️ 지금 버전은 GitOps 동기화 메커니즘 자체를 눈으로 확인하기 위한 것이다.
# 아래 secrets 값은 전부 더미(가짜)다 — 실제 DB/Redis에는 연결되지 않는다.
# 진짜 배포에 쓰려면 이 파일에 평문 비밀번호를 커밋하는 대신 Sealed Secrets나
# External Secrets Operator로 바꿔야 한다 (deploy/README.md 참고).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devtrouble-ai
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/jaehwan990319-cyber/devtrouble-ai.git
    targetRevision: main
    path: deploy/helm/devtrouble-ai
    helm:
      values: |
        image:
          registry: "722867460129.dkr.ecr.ap-northeast-2.amazonaws.com"
          backend:
            tag: "latest"
          frontend:
            tag: "latest"
        secrets:
          jwtSecretKey: "argocd-sync-test-placeholder"
          databaseUrl: "mysql+pymysql://placeholder:placeholder@placeholder-not-real-db:3306/devtrouble"
          redisUrl: "rediss://placeholder-not-real-redis:6379/0?ssl_cert_reqs=CERT_NONE"
          celeryBrokerUrl: "rediss://placeholder-not-real-redis:6379/1?ssl_cert_reqs=CERT_NONE"
          celeryResultBackendUrl: "rediss://placeholder-not-real-redis:6379/2?ssl_cert_reqs=CERT_NONE"

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    # 자동 동기화는 아직 켜지 않는다 — 처음에는 수동으로 SYNC 버튼을 눌러서
    # 눈으로 확인하며 진행하는 게 안전하다. 익숙해지면 automated 블록을 추가하면 된다.
    syncOptions:
      - CreateNamespace=false