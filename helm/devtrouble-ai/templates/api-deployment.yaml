apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devtrouble-ai.fullname" . }}-api
  labels:
    {{- include "devtrouble-ai.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      {{- include "devtrouble-ai.componentSelectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devtrouble-ai.componentLabels" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "devtrouble-ai.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # 마이그레이션은 api 컨테이너의 entrypoint.sh가 기동 시 alembic upgrade head를 실행한다
      # (devtrouble-ai-backend/docker/entrypoint.sh, Dockerfile 참고). 여러 레플리카가 동시에
      # 올라와도 alembic이 자체적으로 버전 테이블 락을 잡으므로 중복 실행에 안전하다.
      containers:
        - name: api
          image: {{ include "devtrouble-ai.image" (dict "root" . "repository" .Values.image.backend.repository "tag" .Values.image.backend.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "devtrouble-ai.fullname" . }}-config
            - secretRef:
                name: {{ include "devtrouble-ai.fullname" . }}-secrets
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
